name: Deploy Lumara (website + game)
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }   # the full-quality trailer is stored in Git LFS
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: interface
      - run: npm ci && npm run build
        working-directory: website
      # Enable online rooms only after the Last Light migration and function are deployed.
      - run: npm ci && npm run edge:check && npm test && npx tsc --noEmit && npx vite build
        working-directory: website/card-game
        env:
          VITE_CARD_MULTIPLAYER: supabase
          VITE_PRACTICE_ONLY: ${{ vars.LAST_LIGHT_MULTIPLAYER_READY == '1' && '0' || '1' }}
      - run: mkdir -p website/dist/play && cp -r interface/dist/. website/dist/play/ && touch website/dist/.nojekyll
      - run: mkdir -p website/dist/cards && cp -r website/card-game/dist/. website/dist/cards/
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
